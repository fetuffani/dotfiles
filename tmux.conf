set -g mouse on

# Alt+tecla chega como Esc+tecla; escape-time baixo evita atraso ao usar o prefixo Alt
set -sg escape-time 10

# Prefix: Alt+b (substitui Ctrl+b)
unbind C-b
set -g prefix M-b
bind M-b send-prefix

# Barra de status em 2 linhas: a segunda mostra as hints dos atalhos
set -g status 2
set -g status-style 'bg=colour235,fg=colour250'
set -g status-format[1] '#[align=centre,bg=colour236,fg=colour245] Alt+b + #[fg=colour81]c#[fg=colour245] nova janela │ #[fg=colour81]n/p#[fg=colour245] próx/ant │ #[fg=colour81]"#[fg=colour245] split ─ │ #[fg=colour81]%%#[fg=colour245] split │ #[fg=colour81]setas#[fg=colour245] mover painel │ #[fg=colour81]z#[fg=colour245] zoom │ #[fg=colour81]x#[fg=colour245] fechar painel │ #[fg=colour81],#[fg=colour245] renomear │ #[fg=colour81]d#[fg=colour245] detach │ #[fg=colour81][#[fg=colour245] scroll │ #[fg=colour81]?#[fg=colour245] todos '
